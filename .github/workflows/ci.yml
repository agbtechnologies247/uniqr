name: UniQR Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build & Test Workspace
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Frontend Type Check & Build
        run: |
          npx tsc --noEmit
          npm run build

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: Backend Type Check & Unit Tests
        run: |
          cd backend
          npx tsc --noEmit
          npm test
